[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slideshow"
version = "1.0.0"
description = "Turn a folder of photos into an MP4 slideshow with Ken Burns motion, crossfades, a title and music, using ffmpeg."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Ziztu" }]
keywords = ["slideshow", "photos", "ffmpeg", "ken-burns", "xfade", "video"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/0xnirlin/photo-slideshow-maker"

[project.scripts]
slideshow = "slideshow:main"

[tool.setuptools]
py-modules = ["slideshow"]
